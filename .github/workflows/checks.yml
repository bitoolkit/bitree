name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test release scripts
        run: python3 -m unittest discover -s test -p '*_test.py'
        shell: bash
      - name: Install native toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter pub get --enforce-lockfile
        shell: bash
      - name: Analyze
        run: flutter analyze --no-pub
        shell: bash
      - name: Test
        run: flutter test --no-pub
        shell: bash

  native-runtime:
    name: Native runtime (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-2022
          - name: macOS
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter pub get --enforce-lockfile
        shell: bash
      - name: Test native Lua runtime
        run: flutter test --no-pub test/native_lua_test.dart
        shell: bash
