name: bitree
description: "面向冰红茶的妙妙小工具"
publish_to: 'none'
version: 0.4.0

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_secure_storage: ^11.0.0
  cookie_jar: ^4.0.8
  html: ^0.15.7
  pointycastle: ^4.0.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.3
  file_picker: ^13.2.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  pub_semver: ^2.2.1
  flutter_markdown_plus: ^1.0.12
  webview_all: ^1.4.11
  webview_all_android: ^1.4.11
  flex_color_picker: ^3.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  webview_platform_interface: ^1.4.11

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/bitree.png
    - assets/wencui/
    - assets/palettes/
